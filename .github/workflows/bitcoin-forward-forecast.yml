name: Bitcoin Forward Forecast Snapshot
concurrency:
  group: bitcoin-forward-forecast-${{ github.head_ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
    paths:
      - 'sce/research/bitcoin_forecast_lab.py'
      - 'examples/run_bitcoin_forecast_lab.py'
      - '.github/workflows/bitcoin-forward-forecast.yml'
jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Wait for a fully closed Coinbase candle and issue forecasts
        run: PYTHONPATH=. python examples/run_bitcoin_forecast_lab.py issue --wait-for-boundary
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-forward-forecast-${{ github.run_id }}
          path: data/bitcoin/coinbase/forecast_lab/forecasts/
          if-no-files-found: error
          retention-days: 90
  settle:
    needs: issue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: bitcoin-forward-forecast-${{ github.run_id }}
          path: data/bitcoin/coinbase/forecast_lab/forecasts/
      - name: Settle after both target candles close
        run: |
          RECORD=$(find data/bitcoin/coinbase/forecast_lab/forecasts -name '*.json' -type f -print -quit)
          test -n "$RECORD"
          PYTHONPATH=. python examples/run_bitcoin_forecast_lab.py settle --record "$RECORD" --wait-for-boundary
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-forward-outcome-${{ github.run_id }}
          path: data/bitcoin/coinbase/forecast_lab/outcomes/
          if-no-files-found: error
          retention-days: 90
