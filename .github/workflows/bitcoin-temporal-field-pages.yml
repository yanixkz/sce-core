name: Publish Bitcoin Temporal Field
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: mkdir -p site/data && python examples/fetch_bitcoin_history.py --out site/data/btc_priceusd_1d.csv --provenance site/data/btc_priceusd_1d.provenance.json
      - run: python examples/build_bitcoin_temporal_field.py --input site/data/btc_priceusd_1d.csv --out site/data/bitcoin_temporal_field.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
