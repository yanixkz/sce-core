<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitcoin Temporal Field</title><style>body{font-family:system-ui;background:#090b0e;color:#e8edf2;margin:0}main{max-width:1450px;margin:auto;padding:22px}.card{background:#11161c;border:1px solid #29323b;border-radius:14px;padding:15px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.muted{color:#91a0ad}.v{font-size:20px}canvas{width:100%;display:block}select{padding:9px;background:#171d24;color:#fff;border:1px solid #394550;border-radius:9px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><p class="muted">SCE / CDS research</p><h1>Bitcoin Temporal Field Laboratory</h1><p class="muted">Real-data view of F(t, τ). No synthetic fallback.</p><div id="status" class="card">Loading empirical field…</div><div class="stats card"><div><small>DATE</small><div id="date" class="v">—</div></div><div><small>BTC PRICE</small><div id="pricev" class="v">—</div></div><div><small>COHERENCE</small><div id="coh" class="v">—</div></div><div><small>PRESSURE</small><div id="press" class="v">—</div></div></div><div class="card"><label>Field layer <select id="metric"><option value="stability">Stability</option><option value="regime">Regime</option><option value="trend">Trend</option><option value="volatility">Volatility</option><option value="drawdown_pressure">Drawdown pressure</option></select></label><h3>BTC logarithmic history</h3><canvas id="pc" width="1400" height="380"></canvas></div><div class="card"><h3>Temporal field</h3><canvas id="fc" width="1400" height="300"></canvas><p class="muted">Click either chart to move the time scanner.</p></div><div class="card"><h3>Time scanner</h3><div id="slice" class="muted">—</div></div><script>
let D,i=0;const q=x=>document.querySelector(x),pc=q('#pc'),fc=q('#fc'),p=pc.getContext('2d'),f=fc.getContext('2d');function col(v){v=Math.max(0,Math.min(1,v));return'hsl('+(8+v*125)+' 58% '+(31+v*18)+'%)'}function draw(){if(!D)return;let T=D.timeline,C=D.cells,S=D.scales.slice().reverse(),m=q('#metric').value,L=70,W=pc.width-90,H=320,logs=T.map(x=>Math.log(x.price_usd)),lo=Math.min(...logs),hi=Math.max(...logs),X=n=>L+n/Math.max(1,T.length-1)*W,Y=v=>20+H-(v-lo)/Math.max(.001,hi-lo)*H;p.clearRect(0,0,pc.width,pc.height);p.strokeStyle='#dce5ed';p.lineWidth=2;p.beginPath();T.forEach((r,n)=>n?p.lineTo(X(n),Y(logs[n])):p.moveTo(X(n),Y(logs[n])));p.stroke();p.strokeStyle='#fff';p.beginPath();p.moveTo(X(i),15);p.lineTo(X(i),345);p.stroke();f.clearRect(0,0,fc.width,fc.height);let map=new Map(T.map((x,n)=>[x.time,n])),h=250/S.length,w=W/T.length;C.forEach(c=>{let n=map.get(c.time),s=S.indexOf(c.scale);if(n===undefined||s<0)return;let v=c[m];if(m==='regime'||m==='trend')v=(v+1)/2;f.fillStyle=col(v);f.fillRect(L+n*w,s*h,Math.max(1,w+.3),h-2)});f.fillStyle='#aab5bf';f.font='14px system-ui';S.forEach((s,n)=>f.fillText(s,15,n*h+h/2));f.strokeStyle='#fff';f.beginPath();f.moveTo(X(i),0);f.lineTo(X(i),250);f.stroke();let t=T[i];q('#date').textContent=t.time.slice(0,10);q('#pricev').textContent='$'+Number(t.price_usd).toLocaleString();q('#coh').textContent=t.coherence.toFixed(3);q('#press').textContent=t.transition_pressure.toFixed(3);q('#slice').innerHTML=C.filter(c=>c.time===t.time).map(c=>'<p><b>'+c.scale+'</b> · regime '+(c.regime>0?'↑':c.regime<0?'↓':'→')+' · stability '+c.stability.toFixed(3)+' · trend '+c.trend.toFixed(3)+'</p>').join('')}function pick(e,c){let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*c.width;i=Math.round((x-70)/(c.width-90)*(D.timeline.length-1));i=Math.max(0,Math.min(D.timeline.length-1,i));draw()}pc.onclick=e=>pick(e,pc);fc.onclick=e=>pick(e,fc);q('#metric').onchange=draw;fetch('./data/bitcoin_temporal_field.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{D=x;i=x.timeline.length-1;q('#status').style.display='none';draw()}).catch(()=>q('#status').textContent='Real dataset is not published yet. Synthetic data is intentionally disabled.');</script></main></body></html>
